name: Windows V0.1

on:
  push:
    branches: [main, "codex/**", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Verify application import
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from app.main_window import MainWindow; from PySide6.QtWidgets import QApplication; app = QApplication([]); window = MainWindow(); assert window.windowTitle()"
